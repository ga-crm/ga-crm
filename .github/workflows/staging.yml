# main -> staging -> VPS, in one run started by hand (Actions > Promote to staging > Run workflow):
#   1. promote  waits for the CI run (ci.yml) of this commit of main and stops unless it passed;
#               then copies the paths of deploy/staging-paths.txt from main to the staging branch
#               (deploy/sync-staging.sh). staging is generated: docs/, requirement/, .claude/ and
#               everything else not listed never reach it, and nobody commits to it by hand.
#   2. build    builds exactly that staging commit (the compilers still check types). Tests are
#               not run here: CI ran them on main, and the staging branch carries no test files.
#   3. deploy   ships one archive over SSH to the Ubuntu 24.04 VPS and switches to it
#               (deploy/remote-deploy.sh). The server is prepared once by deploy/setup-server.sh,
#               which prints the values below (deploy/README.md).
#
# This file lives on main only; the staging branch holds no workflow.
#
# Environment "staging" (Settings > Environments > staging; deployment branch: main):
#   secrets  VPS_HOST         server IP
#            VPS_PORT         SSH port (optional, default 22)
#            VPS_USER         gacrm
#            VPS_SSH_KEY      private key whose .pub went to setup-server.sh, OpenSSH format
#            VPS_KNOWN_HOSTS  the host key lines setup-server.sh printed, so the runner only
#                             talks to this server
#   variable STAGING_URL      public address, checked after each deploy
#                             (default https://221-132-21-32.sslip.io)
name: Promote to staging

on:
  workflow_dispatch:
    inputs:
      skip_ci:
        description: 'Khẩn cấp: deploy mà không chờ CI của commit này xanh'
        type: boolean
        default: false

# One run at a time; a second one waits instead of cutting a running deploy in half
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '26'

jobs:
  promote:
    name: Copy main to staging
    runs-on: ubuntu-24.04
    # Up to 20 minutes of waiting for CI, then seconds of work
    timeout-minutes: 25
    permissions:
      contents: write
      # To read the CI run of this commit
      actions: read
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
    steps:
      # Promoting is from main only: the button also offers other branches
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main, not ${GITHUB_REF_NAME}."
          exit 1

      # Nothing reaches staging before the tests of this exact commit passed on main. A run still
      # going is waited for, so the button can be pressed right after a merge.
      - name: CI of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP_CI: ${{ inputs.skip_ci }}
        run: |
          if [[ "$SKIP_CI" == "true" ]]; then
            echo "::warning::CI check skipped by ${GITHUB_ACTOR}: ${GITHUB_SHA::7} goes to staging without proof that its tests pass."
            exit 0
          fi
          for attempt in $(seq 1 80); do
            run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --event push --limit 1 --json status,conclusion,url \
              --jq '.[0] // empty | "\(.status) \(.conclusion) \(.url)"')"
            read -r status conclusion url <<<"$run" || true
            if [[ "$status" == completed ]]; then
              if [[ "$conclusion" == success ]]; then
                echo "CI passed: $url"
                exit 0
              fi
              echo "::error::CI of ${GITHUB_SHA::7} ended as '$conclusion' ($url). Fix main first, or run again with the emergency box ticked."
              exit 1
            fi
            # A push to main starts CI within seconds; none after a minute means none is coming
            if [[ -z "$status" && $attempt -ge 4 ]]; then
              echo "::error::No CI run found for ${GITHUB_SHA::7}. Re-run the CI workflow on main, or run again with the emergency box ticked."
              exit 1
            fi
            echo "CI is ${status:-not started yet}; waiting ($attempt/80)"
            sleep 15
          done
          echo "::error::CI of ${GITHUB_SHA::7} did not finish within 20 minutes."
          exit 1

      # Full history: the new staging commit is added on top of the staging branch
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync staging
        id: sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash deploy/sync-staging.sh --source "$GITHUB_SHA"

  build:
    name: Build
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_SHA: ${{ needs.promote.outputs.sha }}
    steps:
      # The filtered tree, to prove it builds without what stayed on main
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.promote.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install
        run: |
          npm --prefix backend ci --no-audit --no-fund
          npm --prefix frontend ci --no-audit --no-fund

      # nest build and tsc -b stop on a type error; no linter and no test runs here
      - name: Build
        run: |
          npm --prefix backend run build
          npm --prefix frontend run build

      # One archive: the built API with its lockfile (packages are installed on the server), the
      # built web app, and what the server needs around them
      - name: Package
        run: |
          mkdir -p release/backend release/frontend release/stack/scripts
          cp -R backend/dist backend/package.json backend/package-lock.json release/backend/
          cp -R frontend/dist release/frontend/
          cp -R docker-compose.yml infra .env.example release/stack/
          cp scripts/setup-env.mjs release/stack/scripts/
          cp -R deploy release/deploy
          echo "${RELEASE_SHA}" > release/REVISION
          tar -czf release.tgz -C release .

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release.tgz
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: [promote, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ vars.STAGING_URL || 'https://221-132-21-32.sslip.io' }}
    env:
      STAGING_URL: ${{ vars.STAGING_URL || 'https://221-132-21-32.sslip.io' }}
      # The staging commit that was built, not the commit of main the run started from
      RELEASE_SHA: ${{ needs.promote.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release

      - name: Check secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          missing=()
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing secrets in the staging environment: ${missing[*]} (deploy/README.md, step 3)"
            exit 1
          fi

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and switch
        env:
          DEPLOY_HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
        run: |
          opts=(-i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes -o BatchMode=yes -o ServerAliveInterval=30)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          scp "${opts[@]}" -P "$DEPLOY_PORT" release.tgz "$target:/opt/ga-crm/incoming/${RELEASE_SHA}.tgz"
          # The script travels inside the archive; it is unpacked to a temporary folder and run there
          ssh "${opts[@]}" -p "$DEPLOY_PORT" "$target" "bash -s" <<EOF
          set -euo pipefail
          d=\$(mktemp -d)
          trap 'rm -rf "\$d"' EXIT
          tar -xzf /opt/ga-crm/incoming/${RELEASE_SHA}.tgz -C "\$d" ./deploy/remote-deploy.sh
          bash "\$d/deploy/remote-deploy.sh" ${RELEASE_SHA} </dev/null
          EOF

      # Through nginx and HTTPS, as a user reaches it
      - name: Check the public address
        run: |
          for attempt in $(seq 1 10); do
            if curl -fsS -m 10 "$STAGING_URL/api/v1/health"; then echo; exit 0; fi
            sleep 3
          done
          echo "::error::$STAGING_URL/api/v1/health does not answer; check nginx and the certificate"
          exit 1

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/id_deploy
