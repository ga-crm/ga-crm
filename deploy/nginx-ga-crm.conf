# nginx site of GA CRM. Replace staging.example.com with the real name, then run certbot
# (deploy/README.md, step 6), which adds the HTTPS server and the redirect from HTTP.
# HTTPS is required: in production the session cookie is Secure (__Host- prefix).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name staging.example.com;

    root /opt/ga-crm/current/frontend/dist;
    index index.html;

    # Chat files go up to 50 MB; imports send chunks of up to 4 MB
    client_max_body_size 55m;

    # The API; TRUST_PROXY_HOPS=1 in .env makes it read the client IP nginx passes on
    location /api/ {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Realtime (Socket.IO): same origin, so the session cookie goes with the WebSocket
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Built files carry a hash in their name, so they can be kept for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other path is a screen of the single-page app; index.html is never cached
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
