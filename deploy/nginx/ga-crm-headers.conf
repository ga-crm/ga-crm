# Security headers of the web app's own files (/etc/nginx/snippets/ga-crm-headers.conf). The API
# sends its own through helmet, so the /api and /socket.io locations do not include this.
# HSTS only counts over HTTPS; browsers ignore it on the HTTP redirect.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Invite and password-reset links carry their token in the path
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
